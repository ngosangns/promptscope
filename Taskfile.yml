version: '3'

# The analyzer and CLI live in macos/. The window is promptscope-gpui
# in the sibling repo ns-gpui.

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install the CLI to ~/.local/bin
    cmds:
      - task: cli:install

  cli:build:
    desc: Build the release promptscope CLI
    dir: macos
    cmds:
      - swift build -c release --product promptscope-cli

  cli:install:
    desc: Install the CLI to ~/.local/bin/promptscope
    cmds:
      - |
        set -eu
        ver="$(tr -d '[:space:]' < VERSION)"
        main="macos/Sources/promptscope-cli/main.swift"
        original="$(mktemp)"
        cp "$main" "$original"
        restore() { cp "$original" "$main"; rm -f "$original"; }
        trap restore EXIT
        perl -i -pe 's/^let releaseVersion = ".*"$/let releaseVersion = "'"$ver"'"/' "$main"
        (cd macos && swift build -c release --product promptscope-cli)
        restore
        trap - EXIT
        bin="$(cd macos && swift build -c release --show-bin-path)/promptscope-cli"
        bindir="$HOME/.local/share/promptscope/bin"
        mkdir -p "$bindir" "$HOME/.local/bin"
        cp "$bin" "$bindir/promptscope-$ver"
        chmod 755 "$bindir/promptscope-$ver"
        (cd go && go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "$bindir/promptscope-update-$ver" ./cmd/promptscope)
        chmod 755 "$bindir/promptscope-update-$ver"
        ln -sfn "../share/promptscope/bin/promptscope-$ver" "$HOME/.local/bin/promptscope"
        echo "installed $HOME/.local/bin/promptscope -> $bindir/promptscope-$ver"

  test:
    desc: Test the updater and the Swift analyzer
    cmds:
      - task: cli:test
      - task: kit:test

  cli:test:
    desc: Vet and test the Go updater
    dir: go
    cmds:
      - go vet ./...
      - go test ./...

  kit:test:
    desc: Run the Swift test suite
    dir: macos
    cmds:
      - swift test

  release:build:
    desc: Test and build the release assets in dist/ (no publish)
    cmds:
      - ./scripts/release-local.sh

  release:publish:
    desc: Test, build and publish the GitHub release for VERSION
    prompt: This creates or updates a public GitHub release. Continue?
    cmds:
      - ./scripts/release-local.sh --publish

  dev:install:
    desc: Build the GUI from ../ns-gpui and install "Promptscope Dev.app" into ~/Applications
    cmds:
      - ../ns-gpui/scripts/install-dev.sh promptscope

  dev:install:all:
    desc: Install the promptscope CLI, then its Dev app
    cmds:
      - task: install
      - task: dev:install
