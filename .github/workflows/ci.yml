name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Test updater
        working-directory: go
        run: go vet ./... && go test ./...

      - name: Test
        working-directory: macos
        run: swift test
